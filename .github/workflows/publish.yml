# Publishes one checked wheel and sdist to PyPI through Trusted Publishing.
# Manual only. Run it from the release tag, after the steps in release/PUBLISHING.md.
name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the leading v
        required: true
        type: string
      commit:
        description: Full commit SHA that the tag and main must both be
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Stop unless this is the approved tag, commit and main
        env:
          REF: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          test "$REF" = "refs/tags/v$VERSION"
          test "$(git rev-parse HEAD)" = "$COMMIT"
          test "$(git rev-parse refs/remotes/origin/main)" = "$COMMIT"
      - name: Stop unless CI passed for this exact commit
        env:
          COMMIT: ${{ inputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_gate.py --commit "$COMMIT"
      - name: Build the pair once
        run: uv build --python 3.14 --out-dir release-pair/dist
      - name: Check that pair
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          uv run --no-project --python 3.14 scripts/release_check.py
          --wheel "release-pair/dist/planlens_agent-$VERSION-py3-none-any.whl"
          --sdist "release-pair/dist/planlens_agent-$VERSION.tar.gz"
          --sums release-pair/SHA256SUMS
          --tag "v$VERSION"
          --python "$(uv python find --no-project 3.14)"
      - name: Check the description renders
        run: >-
          uvx --from twine==7.0.0 --with "readme-renderer[md]==46.0"
          twine check --strict release-pair/dist/*
      - name: Record the hashes for the approver
        run: cat release-pair/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the CI gate for the check just before upload
        run: cp scripts/ci_gate.py release-pair/ci_gate.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pair
          path: release-pair
          if-no-files-found: error

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/planlens-agent/
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pair
          path: release-pair
      - name: Stop unless these are exactly the checked files
        working-directory: release-pair/dist
        run: |
          test "$(ls | wc -l)" -eq 2
          sha256sum --check --strict ../SHA256SUMS
      - name: Stop unless CI still passes for this exact commit
        env:
          COMMIT: ${{ inputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 release-pair/ci_gate.py --commit "$COMMIT"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release-pair/dist
